name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://nhatnuong.site/api
          NEXT_PUBLIC_SIGNALR_URL: https://nhatnuong.site
          NEXT_PUBLIC_DEFAULT_LOCALE: vi

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/MenuOrderingOnline

            echo "[$(date)] Starting deployment..."

            # Pull latest code
            git pull origin master

            # Backup database before deploy
            if [ -f scripts/backup-db.sh ]; then
              echo "[$(date)] Creating pre-deploy backup..."
              bash scripts/backup-db.sh || echo "Backup warning: non-critical, continuing deploy"
            fi

            # Build and restart with zero-downtime strategy
            # Build new images first (without stopping running containers)
            docker compose build

            # Restart services one by one to minimize downtime
            docker compose up -d --no-deps --build backend
            echo "[$(date)] Backend restarted, waiting for startup..."
            sleep 10

            docker compose up -d --no-deps --build frontend
            echo "[$(date)] Frontend restarted, waiting for startup..."
            sleep 5

            # Reload nginx to pick up any config changes
            docker compose exec -T nginx nginx -s reload 2>/dev/null || docker compose up -d --no-deps nginx

            # Cleanup old images
            docker image prune -f

            echo "[$(date)] Deployment complete!"
